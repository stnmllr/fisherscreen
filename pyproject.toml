[project]
name = "fisherscreen"
version = "0.1.0"
description = "Phil Fisher stock screener applying 15 principles to public data"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4.0",
    "yfinance>=0.2.50",
    "httpx>=0.27.0",
    "google-cloud-firestore>=2.27.0",
    "google-genai>=2.2.0",
    "python-frontmatter>=1.1.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.32.0",
    "lxml>=6.1.0",
    "html2text>=2024.2.26",
    "tenacity>=9.1.4",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    # Black's stable style is versioned per calendar-year major — an unpinned
    # major would silently reformat the whole tree and turn CI red without a
    # single code change. Major pinned, minor/patch free. Config: [tool.black].
    "black>=26.5.1,<27",
]

[tool.uv]
# dev is a default group so `uv sync` / `uv run python -m pytest` work
# without --group/--extra flags (SOPRA-EPDR: see CLAUDE.md). For a
# production build (Cloud Run, B.5+) pass --no-default-groups.
default-groups = ["dev"]

[project.scripts]
fisherscreen = "app.deepdive.__main__:main"

[tool.black]
# Scope is app/ + tests/ — deliberately not scripts/, infra/, docs/.
# scripts/ is ~60 one-shot diagnostic/backfill artefacts, already treated as a
# special case ([tool.coverage.run] omit); reformatting them is churn on
# forensic material. infra/ is deploy glue, docs/superpowers/audits/ holds
# frozen audit scripts — same character.
# force-exclude (not exclude/extend-exclude) because it applies to paths passed
# explicitly on the command line too — so a bare `black .`, `black app tests`
# and the CI step cannot diverge. Deliberately no line-length override: the
# Black default (88) is what CLAUDE.md means by "Black-formatiert".
force-exclude = '''
(
    ^/scripts/
  | ^/infra/
  | ^/docs/
)
'''
# Pinned instead of inferred: without it Black derives the target range from
# requires-python = ">=3.12" (py312..py315) and its AST safety check warns on
# every run under the pinned 3.12 interpreter. The project runs 3.12
# (.python-version), so formatting output stays identical locally and in CI.
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: tests requiring real APIs or the never-committed local filing cache (cache/filings/, ADR-4); excluded in CI via -m 'not integration', run locally where the cache is populated",
    "allow_output_write: opt-in marker for tests that intentionally write to the real output/ directory (rare, e.g. integration smoke tests). Caller is responsible for cleanup.",
]

[tool.coverage.run]
omit = [
    "app/services/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "\\.\\.\\.",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
